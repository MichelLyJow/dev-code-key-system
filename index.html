<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michel Script - Premium Device Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #000000;
            color: #e6e6e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #0d1117;
            border: 1px solid #202632;
            border-radius: 14px;
            padding: 25px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h1 {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p.desc {
            color: #9aa4b2;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: left;
        }

        .section {
            border: 1px solid #202632;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .field-label {
            font-size: 11px;
            color: #7d8590;
            margin-bottom: 4px;
            display: block;
            text-align: left;
        }

        .code-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #232a35;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            background: #11151c;
            color: #ffffff;
        }

        .code-input:focus {
            outline: none;
            border-color: #4f8ef7;
        }

        .btn-create {
            background: #4f8ef7;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 999px;
            cursor: pointer;
            width: 100%;
        }

        .btn-create:hover {
            background: #6ba1ff;
        }

        .code-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .code-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #11151c;
            border: 1px solid #232a35;
            border-radius: 10px;
            padding: 10px 14px;
        }

        .code-item .code-text {
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            word-break: break-all;
            color: #ffffff;
        }

        .code-item .code-status {
            font-size: 11px;
            color: #7db1ff;
            font-weight: bold;
        }

        .btn-delete {
            background: transparent;
            border: 1px solid #e5484d;
            color: #e5484d;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 999px;
            cursor: pointer;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .btn-delete:hover {
            background: #e5484d;
            color: #ffffff;
        }

        .empty-state {
            color: #7d8590;
            font-size: 13px;
            padding: 20px 0;
            text-align: center;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container">
        <h1>Premium Device Manager</h1>

        <div class="section">
            <span class="field-label">Device ID (UID) sent by the user</span>
            <input type="text" class="code-input" id="newUidInput" placeholder="Paste device UID here...">
            <button class="btn-create" onclick="approveUid()">APPROVE AS PREMIUM</button>
        </div>

        <div class="code-list" id="uidList">
            <div class="empty-state" id="emptyState">No approved devices yet.</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDPm2MG5omvchIMKmPgschmSSwZ_msvSPg",
            authDomain: "key-web-61727.firebaseapp.com",
            databaseURL: "https://key-web-61727-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "key-web-61727",
            storageBucket: "key-web-61727.firebasestorage.app",
            messagingSenderId: "158991751626",
            appId: "1:158991751626:web:605f214e6b5482ca855733"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const uidsRef = db.ref('approvedUIDs');

        function sanitizeKey(uid) {
            // Firebase keys can't contain . # $ [ ] /
            return uid.trim().replace(/[.#$\[\]\/]/g, '');
        }

        function renderUids(snapshot) {
            const list = document.getElementById('uidList');
            list.innerHTML = '';

            if (!snapshot.exists()) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.id = 'emptyState';
                empty.innerText = 'No approved devices yet.';
                list.appendChild(empty);
                return;
            }

            snapshot.forEach((child) => {
                const key = child.key;

                const item = document.createElement('div');
                item.className = 'code-item';
                item.innerHTML = `
                    <div>
                        <div class="code-text">${key}</div>
                        <div class="code-status">PREMIUM ACTIVE</div>
                    </div>
                    <button class="btn-delete" onclick="revokeUid('${key}')">REVOKE</button>
                `;
                list.appendChild(item);
            });
        }

        function approveUid() {
            const input = document.getElementById('newUidInput');
            const raw = input.value.trim();

            if (!raw) return;

            const key = sanitizeKey(raw);
            uidsRef.child(key).set(true);
            input.value = '';
        }

        function revokeUid(key) {
            uidsRef.child(key).remove();
        }

        uidsRef.on('value', renderUids);
    </script>

</body>
</html>
