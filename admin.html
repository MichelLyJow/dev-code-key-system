<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michel Script - Premium Code Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            color: #000000;
            font-size: 18px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p.desc {
            color: #666666;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .create-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .code-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .code-input:focus {
            outline: none;
            border-color: #000000;
        }

        .btn-create {
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-create:hover {
            background: #333333;
        }

        .code-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .code-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f5f5f5;
            border: 1px solid #cccccc;
            border-radius: 8px;
            padding: 10px 14px;
        }

        .code-item .code-text {
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            word-break: break-all;
        }

        .code-item .code-status {
            font-size: 11px;
            color: #008800;
            font-weight: bold;
        }

        .btn-delete {
            background: #ffffff;
            border: 1px solid #cc0000;
            color: #cc0000;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 10px;
        }

        .btn-delete:hover {
            background: #cc0000;
            color: #ffffff;
        }

        .empty-state {
            color: #999999;
            font-size: 13px;
            padding: 20px 0;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container">
        <h1>Premium Code Manager</h1>
        <p class="desc">Create a premium code below. Active codes appear in the list and can be deleted anytime.</p>

        <div class="create-row">
            <input type="text" class="code-input" id="newCodeInput" placeholder="Type a code..." onkeydown="if(event.key==='Enter') createCode()">
            <button class="btn-create" onclick="createCode()">CREATE</button>
        </div>

        <div class="code-list" id="codeList">
            <div class="empty-state" id="emptyState">No premium codes yet.</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDPm2MG5omvchIMKmPgschmSSwZ_msvSPg",
            authDomain: "key-web-61727.firebaseapp.com",
            databaseURL: "https://key-web-61727-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "key-web-61727",
            storageBucket: "key-web-61727.firebasestorage.app",
            messagingSenderId: "158991751626",
            appId: "1:158991751626:web:605f214e6b5482ca855733"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const codesRef = db.ref('premiumCodes');

        function renderCodes(snapshot) {
            const list = document.getElementById('codeList');
            list.innerHTML = '';

            if (!snapshot.exists()) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.id = 'emptyState';
                empty.innerText = 'No premium codes yet.';
                list.appendChild(empty);
                return;
            }

            snapshot.forEach((child) => {
                const key = child.key;
                const code = child.val();

                const item = document.createElement('div');
                item.className = 'code-item';
                item.innerHTML = `
                    <div>
                        <div class="code-text">${code}</div>
                        <div class="code-status">ACTIVE</div>
                    </div>
                    <button class="btn-delete" onclick="deleteCode('${key}')">DELETE</button>
                `;
                list.appendChild(item);
            });
        }

        function createCode() {
            const input = document.getElementById('newCodeInput');
            const value = input.value.trim();

            if (!value) return;

            codesRef.push(value);
            input.value = '';
        }

        function deleteCode(key) {
            codesRef.child(key).remove();
        }

        codesRef.on('value', renderCodes);
    </script>

</body>
</html>
